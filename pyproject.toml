[project]
name = "weather-rest-api"
version = "0.1.0"
description = "REST API for ingesting and querying weather sensor readings."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.2",
    "aiosqlite==0.22.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the intended pattern
    "UP042", # str+Enum -> StrEnum is an unsafe/behavior-changing fix
]

[tool.ruff.format]
quote-style = "double"
